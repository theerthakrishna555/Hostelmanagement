<!DOCTYPE html>
{% extends 'dashboard/warden_side/warden.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-md-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Add Room</h4>

                  <form class="forms-sample" method="POST" action="{% url 'update_room' room_data.id %}"  enctype="multipart/form-data" >
                      {% csrf_token %}

                    <div class="form-group">
                      <label for="exampleInputEmail1">Room Number</label>
                      <input type="text" class="form-control" id="exampleInputEmail1"   name="room_number" value="{{room_data.room_number}}">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputPassword1">Capacity</label>
                      <input type="text" class="form-control" id="exampleInputPassword1"  name="capacity" value="{{room_data.capacity}}">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputConfirmPassword1">Available Beds</label>
                      <input type="number" class="form-control" id="exampleInputConfirmPassword1"  name="beds" value="{{room_data.available_beds}}">
                    </div>
                       <div class="form-group">
                      <label for="exampleInputConfirmPassword1">Price</label>
                      <input type="number" class="form-control" id="exampleInputConfirmPassword2"  name="price" value="{{room_data.price_per_month}}">
                    </div>

                      <div>
                          <label>Room Image 1</label>
                          <img src="{{room_data.image1.url}}" width="120">
                          <input type="file" name="image1">
                      </div>

                      <div>
                          <label>Room Image 2</label>
                          <img src="{{room_data.image2.url}}" width="120">
                          <input type="file" name="image2">
                      </div>

                    <button type="submit" class="btn btn-primary mr-2">ADD</button>

                  </form>
                </div>
              </div>
            </div>
</body>
</html>
{% endblock %}
