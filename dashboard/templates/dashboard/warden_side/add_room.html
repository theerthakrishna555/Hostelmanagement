<!DOCTYPE html>
{% extends 'dashboard/warden_side/warden.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-md-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Add Room</h4>

                  <form class="forms-sample" method="POST" action="{% url 'Add_room' %}"  enctype="multipart/form-data" >
                      {% csrf_token %}
                    <div class="form-group">
                      <label for="exampleInputUsername1">Hostel</label>
                        <select class="form-control" id="exampleInputUsername1"  name="hostel">
                            {% for h in hostel_list %}
                            <option value="{{h.id}}">{{h.name}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                      <label for="exampleInputEmail1">Room Number</label>
                      <input type="text" class="form-control" id="exampleInputEmail1" placeholder="Email"  name="room_number">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputPassword1">Capacity</label>
                      <input type="text" class="form-control" id="exampleInputPassword1" placeholder="Password" name="capacity">
                    </div>
                    <div class="form-group">
                      <label for="exampleInputConfirmPassword1">Available Beds</label>
                      <input type="number" class="form-control" id="exampleInputConfirmPassword1" placeholder="Password" name="beds">
                    </div>
                       <div class="form-group">
                      <label for="exampleInputConfirmPassword1">Price</label>
                      <input type="number" class="form-control" id="exampleInputConfirmPassword2" placeholder="Password" name="price">
                    </div>

                      <div>
                          <label>Room Image 1</label>
                          <input type="file" name="image1">
                      </div>

                      <div>
                          <label>Room Image 2</label>
                          <input type="file" name="image2">
                      </div>

                    <button type="submit" class="btn btn-primary mr-2">ADD</button>

                  </form>
                </div>
              </div>
            </div>
</body>
</html>
{% endblock %}
