
<!doctype html>
{%  load static %}
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'login_page/fonts/icomoon/style.css' %}">

    <link rel="stylesheet" href="{% static 'login_page/css/owl.carousel.min.css' %}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'login_page/css/bootstrap.min.css' %}">

    <!-- Style -->
    <link rel="stylesheet" href="{% static 'login_page/css/style.css' %}">

    <title>Login #2</title>
  </head>
  <body>


  <div class="d-lg-flex half">
    <div class="bg order-1 order-md-2" style="background-image: url({% static 'login_page/images/bg_1.jpg' %});"></div>
    <div class="contents order-2 order-md-1">

      <div class="container">
        <div class="row align-items-center justify-content-center">
          <div class="col-md-7">
            <h3>Login to <strong>StayEase</strong></h3>
            <p class="mb-4">Lorem ipsum dolor sit amet elit. Sapiente sit aut eos consectetur adipisicing.</p>
            <form action="#" method="post">
                {% csrf_token %}
              <div class="form-group first">
                <label for="username">Username</label>
                <input type="text" class="form-control" placeholder="your-email@gmail.com" id="username" name="username">
              </div>
              <div class="form-group last mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" placeholder="abc@123! " id="password" name="password">
              </div>



              <button type="submit"  class="btn btn-block btn-primary"></button>

            </form>
          </div>
        </div>
      </div>
    </div>


  </div>



    <script src="{% static 'login_page/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'login_page/js/popper.min.js' %}"></script>
    <script src="{% static 'login_page/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'login_page/js/main.js' %}"></script>
  </body>
</html>
