<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'register_page/fonts/icomoon/style.css' %}">

    <link rel="stylesheet" href="{% static 'register_page/css/owl.carousel.min.css' %}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'register_page/css/bootstrap.min.css' %}">

    <!-- Style -->
    <link rel="stylesheet" href="{% static 'register_page/css/style.css' %}">

    <title>Sign Up #3</title>
  </head>
  <body>


  <div class="half">
    <div class="bg order-1 order-md-2" style="background-image: url({% static 'register_page/images/bg_1.jpg'%});"></div>
    <div class="contents order-2 order-md-1">

      <div class="container">
        <div class="row align-items-center justify-content-center">
          <div class="col-md-6">
            <div class="form-block">
              <div class="text-center mb-5">
              <h3>Register</h3>

              </div>
              <form  method="post" action="{% url 'register_save' %}">
                  {% csrf_token %}
                <div class="form-group first">
                  <label for="name">Name</label>
                  <input type="text" class="form-control"  id="name" name="username">
                </div>
                <div class="form-group first">
                  <label for="username">Email Address</label>
                  <input type="text" class="form-control"  id="username" name="email">
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" class="form-control"  id="password" name="password1">
                </div>
                <div class="form-group last mb-3">
                  <label for="re-password">Re-type Password</label>
                  <input type="password" class="form-control"  id="re-password" name="password2">
                </div>

                <div class="d-sm-flex mb-5 align-items-center">

                  <span class="ml-auto"><a href="{% url 'login' %}" class="forgot-pass">Have an account? Login</a></span>
                </div>

                  <button type="submit"  class="btn btn-block btn-primary">Register</button>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>


  </div>



    <script src="{% static 'register_page/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'register_page/js/popper.min.js' %}"></script>
    <script src="{% static 'register_page/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'register_page/js/main.js' %}"></script>
  </body>
</html>
